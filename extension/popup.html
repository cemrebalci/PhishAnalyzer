<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
    }
    h2 { color: #22d3ee; margin: 0 0 8px 0; font-size: 18px; }
    p { color: #9ca3af; font-size: 13px; margin: 0 0 12px 0; }
    .status {
      background: #064e3b;
      border: 1px solid #10b981;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      color: #6ee7b7;
      margin-bottom: 12px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: #22d3ee;
      border: none;
      border-radius: 8px;
      color: #111827;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .btn:hover { background: #06b6d4; }
  </style>
</head>
<body>
  <h2>🛡️ PhishAnalyzer</h2>
  <p>AI destekli phishing koruma aktif</p>
  <div class="status">
    ✅ Koruma aktif — her site otomatik analiz ediliyor
  </div>
  <button class="btn" onclick="window.open('https://phish-analyzer.vercel.app', '_blank')">
    🌐 Web Platformunu Aç
  </button>
  <button class="btn" onclick="window.open('https://phish-analyzer.vercel.app', '_blank')" style="background: #374151; color: white;">
    📊 Dashboard'u Aç
  </button>
</body>
</html>
