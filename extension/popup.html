<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
    }
    h2 { color: #22d3ee; margin: 0 0 8px 0; font-size: 18px; }
    p { color: #9ca3af; font-size: 13px; margin: 0 0 12px 0; }
    .status {
      background: #064e3b;
      border: 1px solid #10b981;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      color: #6ee7b7;
      margin-bottom: 12px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: #22d3ee;
      border: none;
      border-radius: 8px;
      color: #111827;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 8px;
      display: block;
      text-decoration: none;
      text-align: center;
      box-sizing: border-box;
    }
    .btn:hover { background: #06b6d4; }
    .btn-dark {
      background: #374151;
      color: white;
    }
    .btn-dark:hover { background: #4b5563; }
  </style>
</head>
<body>
  <h2>🛡️ PhishAnalyzer</h2>
  <p>AI destekli phishing koruma aktif</p>
  <div class="status">
    ✅ Koruma aktif — her site otomatik analiz ediliyor
  </div>
  <a class="btn" href="https://phish-analyzer.vercel.app" target="_blank">
    🌐 Web Platformunu Aç
  </a>
  <a class="btn btn-dark" href="https://phish-analyzer.vercel.app/?page=dashboard" target="_blank">
    📊 Dashboard'u Aç
  </a>

  <script>
    document.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault()
        chrome.tabs.create({ url: a.href })
      })
    })
  </script>
</body>
</html>
